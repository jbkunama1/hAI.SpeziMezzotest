# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

version: '3.8'

services:
  spezi-mezzotest:
    image: ghcr.io/jbkunama1/hai.spezimezzotest:latest
    container_name: speci-mezzotest
    restart: unless-stopped
    ports:
          - "8123:80"
    networks:
      - highfishNetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  highfishNetwork:
    external: true
