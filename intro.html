<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hAI.SpeziMezzotest – Intro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .skip {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      backdrop-filter: blur(5px);
      z-index: 10;
    }
    .skip:hover { background: rgba(0,0,0,0.8); }
  </style>
</head>
<body>
  <video id="introVideo" autoplay muted playsinline>
    <source src="mezzotest.mp4" type="video/mp4">
    Dein Browser unterstützt kein Video.
  </video>
  <button class="skip" onclick="finishIntro()">Überspringen →</button>

  <script>
    const video = document.getElementById('introVideo');
    function finishIntro() {
      localStorage.setItem('intro_seen', 'true');
      window.location.href = 'role-select.html';
    }
    video.addEventListener('ended', finishIntro);
    video.addEventListener('error', finishIntro); // Fallback if video missing/fails
  </script>
</body>
</html>
